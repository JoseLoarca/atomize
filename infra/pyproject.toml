[project]
name = "atomize-infra"
version = "0.1.0"
description = "AWS CDK app defining Atomize's infrastructure (see docs/TECH_STACK.md)"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.270.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.coverage.run]
source = ["stacks"]

[tool.coverage.report]
show_missing = true

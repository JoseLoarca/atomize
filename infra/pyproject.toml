[project]
name = "atomize-infra"
version = "0.1.0"
description = "AWS CDK app defining Atomize's infrastructure (see docs/TECH_STACK.md)"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.270.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks"]

[project]
name = "atomize-api"
version = "0.1.0"
description = "Atomize household expense tracker API (FastAPI on AWS Lambda)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.119",
    "fastapi>=0.162.0",
    "mangum>=0.22.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-jose>=3.5.0",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
